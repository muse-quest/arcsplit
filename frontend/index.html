<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>ArcSplit — split USDC on Arc</title>
<style>
  body { font-family: system-ui, sans-serif; max-width: 560px; margin: 2rem auto; padding: 0 1rem; }
  .row { display: flex; gap: 0.5rem; margin-bottom: 0.5rem; }
  input { flex: 1; padding: 0.5rem; }
  input.shares { flex: 0 0 90px; }
  button { padding: 0.6rem 1rem; cursor: pointer; }
  #status { margin-top: 1rem; word-break: break-all; }
</style>
</head>
<body>
<h1>ArcSplit</h1>
<p>Split native USDC across recipients in one transaction on Arc (chain 5042).</p>

<button id="connect">Connect wallet</button>
<p id="account"></p>

<h3>Recipients</h3>
<div id="recipients"></div>
<button id="add">+ Add recipient</button>

<h3>Amount (USDC)</h3>
<input id="amount" type="number" step="0.000001" min="0" placeholder="1.0">

<p><button id="split">Split it</button></p>
<div id="status"></div>

<script type="importmap">
{ "imports": { "viem": "https://esm.sh/viem@2.21.0" } }
</script>
<script type="module">
import { createWalletClient, createPublicClient, custom, http, parseUnits, defineChain } from "viem";

const arc = defineChain({
  id: 5042,
  name: "Arc",
  nativeCurrency: { name: "USDC", symbol: "USDC", decimals: 18 },
  rpcUrls: { default: { http: ["https://rpc.mainnet.arc.io"] } },
});

// TODO: set after deployment
const CONTRACT = "0x0000000000000000000000000000000000000000";
const ABI = [{
  type: "function", name: "split", stateMutability: "payable",
  inputs: [
    { name: "recipients", type: "address[]" },
    { name: "shares", type: "uint256[]" }
  ],
  outputs: []
}];

const recipientsEl = document.getElementById("recipients");
function addRow(addr = "", shares = "1") {
  const div = document.createElement("div");
  div.className = "row";
  div.innerHTML = `<input class="addr" placeholder="0x..." value="${addr}">
                   <input class="shares" type="number" min="1" value="${shares}">`;
  recipientsEl.appendChild(div);
}
addRow(); addRow();
document.getElementById("add").onclick = () => addRow();

let walletClient, publicClient, account;
document.getElementById("connect").onclick = async () => {
  if (!window.ethereum) return setStatus("No wallet found.");
  walletClient = createWalletClient({ chain: arc, transport: custom(window.ethereum) });
  publicClient = createPublicClient({ chain: arc, transport: http() });
  [account] = await walletClient.requestAddresses();
  try {
    await window.ethereum.request({
      method: "wallet_addEthereumChain",
      params: [{ chainId: "0x13b2", chainName: "Arc", nativeCurrency: { name: "USDC", symbol: "USDC", decimals: 18 }, rpcUrls: ["https://rpc.mainnet.arc.io"], blockExplorerUrls: ["https://explorer.arc.io"] }]
    });
  } catch (e) { /* already added */ }
  document.getElementById("account").textContent = "Connected: " + account;
};

document.getElementById("split").onclick = async () => {
  if (!account) return setStatus("Connect your wallet first.");
  if (CONTRACT === "0x0000000000000000000000000000000000000000")
    return setStatus("Contract not deployed yet — address goes here after deploy.");
  const rows = [...recipientsEl.querySelectorAll(".row")];
  const recipients = rows.map(r => r.querySelector(".addr").value.trim()).filter(Boolean);
  const shares = rows.slice(0, recipients.length).map(r => BigInt(r.querySelector(".shares").value || "1"));
  if (!recipients.length) return setStatus("Add at least one recipient.");
  const value = parseUnits(document.getElementById("amount").value || "0", 18);
  if (value === 0n) return setStatus("Enter an amount.");
  setStatus("Sending...");
  try {
    const hash = await walletClient.writeContract({
      address: CONTRACT, abi: ABI, functionName: "split",
      args: [recipients, shares], account, value, chain: arc
    });
    setStatus("Sent: " + hash);
  } catch (e) {
    setStatus("Failed: " + (e.shortMessage || e.message));
  }
};

function setStatus(t) { document.getElementById("status").textContent = t; }
</script>
</body>
</html>
